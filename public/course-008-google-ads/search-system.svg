<text x="90" y="165" font-family="Arial" font-size="22" fill="#64748b">Intent → message → landing page → measurable result</text>
<g transform="translate(80 270)" font-family="Arial">
<rect width="260" height="280" rx="30" fill="#dbeafe"/><text x="28" y="58" font-size="22" font-weight="900" fill="#1d4ed8">SEARCH INTENT</text><text x="28" y="112" font-size="18" fill="#334155">Keywords</text><text x="28" y="151" font-size="18" fill="#334155">Match types</text><text x="28" y="190" font-size="18" fill="#334155">Search terms</text><text x="28" y="229" font-size="18" fill="#334155">Negatives</text>
