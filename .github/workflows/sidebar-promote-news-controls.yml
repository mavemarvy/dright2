name: Sidebar promote news controls

on:
  push:
    branches: [sidebar-promote-news-controls]
    paths:
      - 'scripts/apply-sidebar-promote-news-controls.mjs'
      - '.github/workflows/sidebar-promote-news-controls.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sidebar-promote-news-controls

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply sidebar fixes
        run: node scripts/apply-sidebar-promote-news-controls.mjs

      - name: Assert navigation and controls
        run: |
          grep -q "path: '/promote', label: 'Promote'" src/components/AppShell.tsx
          grep -q "path: '/news', label: 'News'" src/components/AppShell.tsx
          test "$(grep -o '<UIPreferencesToggles />' src/components/AppShell.tsx | wc -l)" -ge 2
          grep -q 'Route path="/news" element={<AnnouncementsPage/>}' src/App.tsx
          grep -q "const newsField = location.pathname === '/news';" src/pages/AnnouncementsPage.tsx
          grep -q "canonical={newsField ? '/news' : '/announcements'}" src/pages/AnnouncementsPage.tsx

      - name: Strict currency audit
        run: node scripts/check-hardcoded-currency.mjs --strict

      - name: TypeScript and Vite build
        run: npm run build

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No sidebar source changes required."
            exit 0
          fi
          git config user.name "DRIGHT Navigation Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx src/App.tsx src/pages/AnnouncementsPage.tsx
          git commit -m "Restore sidebar controls and expose Promote and News [sidebar-promote-news-controls-output]"
          git push origin HEAD:sidebar-promote-news-controls
