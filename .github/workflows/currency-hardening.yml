name: Currency hardening codemod

on:
  push:
    branches: [currency-cleanup]
    paths:
      - 'scripts/apply-currency-hardening.mjs'
      - 'scripts/apply-currency-hardening-leftovers.mjs'
      - '.github/workflows/currency-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[currency-hardening-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: currency-cleanup

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply currency hardening
        run: |
          node scripts/apply-currency-hardening.mjs
          node scripts/apply-currency-hardening-leftovers.mjs

      - name: Strict currency audit
        run: node scripts/check-hardcoded-currency.mjs --strict

      - name: TypeScript and Vite build
        run: npm run build

      - name: Commit hardened source to cleanup branch
        run: |
          if git diff --quiet; then
            echo "No currency hardening changes required."
            exit 0
          fi
          git config user.name "DRIGHT Currency Hardening"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Currency: apply global display hardening [currency-hardening-output]"
          git push origin HEAD:currency-cleanup
