name: Currency hardening codemod

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-currency-hardening.mjs'
      - '.github/workflows/currency-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[currency-hardening-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact currency hardening
        run: node scripts/apply-currency-hardening.mjs

      - name: Build and audit
        run: npm run build

      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo "No currency hardening changes required."
            exit 0
          fi
          git config user.name "DRIGHT Currency Hardening"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Currency: apply global display hardening [currency-hardening-output]"
          git push origin HEAD:main
