name: Nav label recursion hotfix

on:
  push:
    branches: [navlabel-recursion-hotfix]
    paths:
      - 'scripts/fix-navlabel-recursion.mjs'
      - '.github/workflows/navlabel-recursion-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: navlabel-recursion-hotfix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hotfix
        run: node scripts/fix-navlabel-recursion.mjs

      - name: Assert nav label is non-recursive
        run: |
          grep -q "item.label ?? (item.labelKey ? t(item.labelKey) : item.path);" src/components/AppShell.tsx
          ! grep -q "item.labelKey ? navLabel(item, t)" src/components/AppShell.tsx

      - name: Strict currency audit
        run: node scripts/check-hardcoded-currency.mjs --strict

      - name: Production build
        run: npm run build

      - name: Commit verified hotfix
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "DRIGHT Hotfix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx
          git commit -m "Fix sidebar nav label recursion [navlabel-hotfix-output]"
          git push origin HEAD:navlabel-recursion-hotfix
