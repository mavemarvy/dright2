name: Promotion expansion 3

on:
  push:
    branches: [promotion-expansion-3]
    paths:
      - 'scripts/apply-promotion-expansion-3.mjs'
      - '.github/workflows/promotion-expansion-3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promotion-expansion-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply premium placement wiring
        run: node scripts/apply-promotion-expansion-3.mjs

      - name: Strict currency audit
        run: node scripts/check-hardcoded-currency.mjs --strict

      - name: TypeScript and Vite build
        run: npm run build

      - name: Commit verified source wiring
        run: |
          if git diff --quiet; then
            echo "No premium promotion page changes required."
            exit 0
          fi
          git config user.name "DRIGHT Promotion Expansion"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AnnouncementsPage.tsx src/pages/MarketPage.tsx
          git commit -m "Promotion: wire announcement news suggestions and trending [promotion-expansion-3-output]"
          git push origin HEAD:promotion-expansion-3
