name: Taxonomy Branch Build Diagnostic

on:
  push:
    branches:
      - feature/listing-taxonomy-tree
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
